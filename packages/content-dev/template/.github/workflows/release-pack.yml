name: Release content pack
on:
  workflow_dispatch:
    inputs:
      expected_integrity:
        description: SHA-512 integrity of the desktop release archive
        type: string
        required: false
      publish_npm:
        description: Publish the verified archive to npm
        type: boolean
        default: false
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check selected tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --ignore-scripts
      - name: Build and verify release archive
        env:
          EXPECTED_INTEGRITY: ${{ inputs.expected_integrity }}
        run: node .github/scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: release-output/
          if-no-files-found: error
  github:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: content-pack
      - run: sha512sum -c SHA512SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz SHA512SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
  npm:
    if: inputs.publish_npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: content-pack
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sha512sum -c SHA512SUMS
      - name: Check npm repository identity
        run: |
          tar -xOf ./*.tgz package/package.json | node --input-type=commonjs -e '
            const {repository} = JSON.parse(require("node:fs").readFileSync(0, "utf8"))
            const actual = repository?.url?.replace(/^git\+/, "").replace(/\.git$/, "")
            if (actual !== process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY)
              throw Error("Set package.json repository.url to the HTTPS address of this GitHub repository")
          '
      - run: npm publish ./*.tgz --ignore-scripts --access public --registry=https://registry.npmjs.org/
