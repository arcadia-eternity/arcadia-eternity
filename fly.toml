# One process owns every room. Restarts/deployments abandon all rooms.
app = 'test-battle'
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '15s'

[build]
# CI supplies the built image.

[deploy]
strategy = 'rolling'
max_unavailable = 1

[processes]
# Map the existing Fly secret names to the V4 account provider settings.
app = "sh -ec 'export SMTP_PASSWORD=\"$SMTP_PASS\" GITHUB_APP_CLIENT_ID=\"$ARCADIA_G3_GITHUB_CLIENT_ID\" GITHUB_APP_CLIENT_SECRET=\"$ARCADIA_G3_GITHUB_CLIENT_SECRET\"; exec node dist/cli.js server'"

[http_service]
internal_port = 8102
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = '30s'
timeout = '10s'
grace_period = '30s'
method = 'GET'
path = '/health'

[mounts]
source = 'arcadia_state'
destination = '/app/state'
initial_size = '1gb'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

[env]
SERVER_ID = 'arcadia-official'
ACCOUNT_MODE = 'g3'
ARCADIA_DATA_DIR = '/app/state'
PUBLIC_ORIGIN = 'https://battle.yuuinih.com'
CORS_ORIGIN = 'https://battle.yuuinih.com'
MANAGEMENT_REQUIRE_TLS = 'false'
MANAGEMENT_COOKIE_SAME_SITE = 'none'
SMTP_HOST = 'smtp.qcloudmail.com'
SMTP_PORT = '465'
SMTP_FROM = 'noreply@auth.yuuinih.com'
GITHUB_APP_REDIRECT_URIS = 'https://battle.yuuinih.com/account'
