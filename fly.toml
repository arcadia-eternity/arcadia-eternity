# One process owns every room. Restarts/deployments abandon all rooms.
app = 'test-battle'
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '15s'

[build]
# CI supplies the built image.

[deploy]
strategy = 'rolling'
max_unavailable = 1

[processes]
# Keep the v3 SMTP secret available to the old image during the guest rollout.
app = "sh -ec 'if [ \"$ACCOUNT_MODE\" = guest ]; then unset SMTP_USER; fi; exec node dist/cli.js server'"

[http_service]
internal_port = 8102
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = '30s'
timeout = '10s'
grace_period = '30s'
method = 'GET'
path = '/health'

[mounts]
source = 'arcadia_state'
destination = '/app/state'
initial_size = '1gb'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

[env]
SERVER_ID = 'arcadia-official'
ACCOUNT_MODE = 'guest'
ARCADIA_DATA_DIR = '/app/state'
PUBLIC_ORIGIN = 'https://battle.yuuinih.com'
CORS_ORIGIN = 'https://battle.yuuinih.com,https://test-battle.fly.dev'
