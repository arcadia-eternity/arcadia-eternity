pet_tuntun:
  name: Tuntun
  description: Tuntun is born in treacherous glacial lakes; to keep from being swept away by the waves it can only cling
    tightly to floating ice.
pet_binghutun:
  name: Binghutun
  description: Having grown up, Binghutun has become much sturdier, yet it still relies on its “life ring”.
pet_bingchuantun:
  name: Bingchuantun
  description: Bingchuantun still keeps the “life ring” from its youth at the tip of its tail, but it no longer needs it!
