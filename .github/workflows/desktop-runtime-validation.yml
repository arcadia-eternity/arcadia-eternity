name: Desktop runtime validation

on:
  pull_request:
    branches: [refactor/v4, main]
    paths:
      - '.github/workflows/desktop-runtime-validation.yml'
      - 'bin/**'
      - 'packages/**'
      - 'packs/**'
      - 'resource/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'rolldown.config.*'
  push:
    branches: [refactor/v4, 'codex/**']
    paths:
      - '.github/workflows/desktop-runtime-validation.yml'
      - 'bin/**'
      - 'packages/**'
      - 'packs/**'
      - 'resource/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'rolldown.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each addon is built and executed on its actual target, without cross-compilation.
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      HUSKY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Existing workspace clean scripts use rm; hosted Windows runners include Git Bash.
      npm_config_script_shell: bash
      NODE_OPTIONS: --max-old-space-size=4096
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm

      - name: Verify native runner target
        run: |
          mkdir -p .artifacts/desktop
          node -e 'const assert=require("node:assert/strict"); assert.equal(process.platform,process.env.EXPECTED_PLATFORM); assert.equal(process.arch,process.env.EXPECTED_ARCH); console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,abi:process.versions.modules}));' | tee .artifacts/desktop/runner.json

      - name: Install Electron runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libxss1

      - name: Install locked dependencies and native development addon
        run: pnpm install --frozen-lockfile | tee .artifacts/desktop/install.log

      - name: Build workspace runtime dependencies
        run: pnpm run build:package | tee .artifacts/desktop/workspace-build.log

      - name: Verify staging and native persistence
        env:
          ARCADIA_DESKTOP_NATIVE_TEST: '1'
        run: node --test scripts/stage-desktop-runtime.test.mjs scripts/desktop-runtime-portability.test.mjs scripts/desktop-sqlite-native.test.mjs scripts/desktop-runtime-licenses.test.mjs scripts/desktop-license-provenance.test.mjs | tee .artifacts/desktop/native-tests.log

      - name: Build desktop renderer
        run: pnpm --filter @arcadia-eternity/web-ui run build-only | tee .artifacts/desktop/renderer-build.log

      - name: Stage relocatable runtime for this Electron target
        run: pnpm exec node scripts/stage-desktop-runtime.mjs --output packages/web-ui/dist/arcadia-server --online --allow-incomplete-notices | tee .artifacts/desktop/runtime-stage.log

      - name: Package locally and execute the packaged SQLite smoke
        # The preview hook launches the packaged Electron executable and verifies write-close-reopen.
        # The command uses publish: never and requires no signing or release token.
        env:
          ARCADIA_DESKTOP_MANAGED_HOST_TEST: '1'
        run: pnpm --filter @arcadia-eternity/web-ui run electron:pack:preview | tee .artifacts/desktop/package.log

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .artifacts/desktop/
            packages/web-ui/dist/arcadia-server/arcadia-desktop-runtime.json
            packages/web-ui/dist/arcadia-server/licenses/notice.json
            packages/web-ui/release-preview/builder-effective-config.yaml
