name: Deploy to Fly.io (Production)

on:
  repository_dispatch:
    types: [deploy-production]
  # 手动触发
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: choice
        options:
          - production
      version:
        description: 'Version to deploy'
        required: false
        type: string

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Fly.io (Production)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.source_commit || inputs.version || github.sha }}

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          version="${REQUESTED_VERSION:-$package_version}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine production image reference
        id: image-info
        env:
          IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
              echo "Missing or invalid release image digest or source commit." >&2
              exit 1
            fi
            image_ref="$image@$IMAGE_DIGEST"
          elif [ "$VERSION" = latest ]; then
            image_ref="$image:production"
          else
            image_ref="$image:v$VERSION"
          fi
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"

      # A room cannot be routed between independent in-memory owners.
      - name: Require a single server instance
        run: |
          count="$(flyctl machine list --json | jq '[.[] | select(.state != "destroyed")] | length')"
          if [ "$count" -gt 1 ]; then
            echo "This runtime requires one Machine. Reduce the fleet during planned maintenance before deploying."
            exit 1
          fi

      - name: Deploy to production
        run: |
          echo "Deploying to production with image: ${{ steps.image-info.outputs.image-ref }}"
          echo "Version: ${{ steps.version.outputs.version }}"

          # Deploy using the production image
          flyctl deploy \
            --image "${{ steps.image-info.outputs.image-ref }}" \
            --remote-only \
            --ha=false \
            --wait-timeout 600 \
            --verbose
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify production deployment
        run: |
          echo "Production deployment completed successfully!"
          echo "Production URL: https://test-battle.fly.dev"
          echo "Version: ${{ steps.version.outputs.version }}"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --max-time 10 https://test-battle.fly.dev/health > /dev/null; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed after deployment." >&2
          exit 1
