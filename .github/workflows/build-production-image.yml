name: Build Production Docker Image

on:
  repository_dispatch:
    types: [production-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-production-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag_name || github.sha }}

      - name: Get version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ] && [ "$REQUESTED_VERSION" != "$package_version" ]; then
            echo "Release version does not match the tagged package version." >&2
            exit 1
          fi
          echo "version=${REQUESTED_VERSION:-$package_version}" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: org.opencontainers.image.revision=${{ steps.version.outputs.source_commit }}
          tags: |
            type=raw,value=production
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push production Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_ENV=production
            VERSION=${{ steps.version.outputs.version }}
            GITHUB_SHA=${{ steps.version.outputs.source_commit }}
            COMMIT_HASH=${{ steps.version.outputs.source_commit }}

      - name: Image build summary
        run: |
          echo "## 🐳 Production Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This image is ready for production deployment." >> $GITHUB_STEP_SUMMARY

      - name: Trigger production deployment
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy-production',
              client_payload: {
                version: process.env.VERSION,
                image_digest: process.env.IMAGE_DIGEST,
                source_commit: process.env.SOURCE_COMMIT
              }
            });
            console.log('Triggered production deployment via repository dispatch');
