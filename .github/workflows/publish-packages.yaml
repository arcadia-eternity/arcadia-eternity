name: Publish UGC Packages

on:
  push:
    tags: ['data-pack-base-v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SDK or data-pack-base release tag'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BASE_ONLY: ${{ startsWith(inputs.tag || github.ref_name, 'data-pack-base-v') }}

jobs:
  verify-archives:
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check the requested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE_ONLY" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^data-pack-base-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            exit
          fi
          [[ "$RELEASE_TAG" =~ ^arcadia-eternity-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '(.isDraft or .isPrerelease) | not'
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Record the verified source revision
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the author SDK dependency graph
        run: pnpm --filter @arcadia-eternity/content-sdk... --filter @arcadia-eternity/data-pack-base... --filter @arcadia-eternity/protocol... run build
      - name: Test author tooling and package loader
        run: |
          pnpm test:content-dev
          pnpm --filter @arcadia-eternity/pack-loader test:run
      - name: Pack and inspect the selected archives
        run: node scripts/release-author-sdk.mjs "${{ env.BASE_ONLY == 'true' && 'pack-base' || 'pack' }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ugc-npm-packages-${{ env.RELEASE_TAG }}
          path: dist/ugc-release/
          if-no-files-found: error

  publish-packages:
    needs: verify-archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-ugc-packages-${{ startsWith(inputs.tag || github.ref_name, 'data-pack-base-v') }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-archives.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.21.0
      - run: pnpm --filter @arcadia-eternity/const install --prod --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ugc-npm-packages-${{ env.RELEASE_TAG }}
          path: dist/ugc-release/
      - name: Publish verified archives with npm Trusted Publishing
        run: node scripts/release-author-sdk.mjs "${{ env.BASE_ONLY == 'true' && 'publish-base' || 'publish' }}"
