name: Publish UGC Packages

on:
  workflow_dispatch:
  push:
    tags: ['ugc-v*']

concurrency:
  group: publish-ugc-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arcadia-eternity'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the author SDK dependency graph
        run: pnpm --filter @arcadia-eternity/content-dev... --filter @arcadia-eternity/data-pack-base... run build
      - name: Test author tooling and package loader
        run: |
          pnpm test:content-dev
          pnpm --filter @arcadia-eternity/pack-loader test:run
      - name: Pack and inspect the eight release archives
        run: pnpm pack:ugc
      - name: Install archives in a separate author project and exercise a full battle
        run: pnpm verify:ugc-release
      - uses: actions/upload-artifact@v4
        with:
          name: ugc-npm-packages
          path: dist/ugc-release/
          if-no-files-found: error
      - name: Publish verified archives to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const release = JSON.parse(readFileSync('dist/ugc-release/release.json', 'utf8'))
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `ugc-v${release.version}`)
            throw new Error('Release tag must match the package version')
          for (const pkg of release.packages) {
            // Existing versions fail rather than silently accepting unrelated bytes.
            execFileSync('npm', ['publish', `dist/ugc-release/${pkg.filename}`, '--ignore-scripts', '--registry', release.registry, '--tag', release.tag], { stdio: 'inherit' })
          }
          JS
      - name: Download the published release into an empty cache and verify author workflow
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm verify:ugc-release --registry
