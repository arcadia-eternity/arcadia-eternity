name: Publish UGC Packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable Arcadia release tag (arcadia-eternity-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify-archives:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check the requested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^arcadia-eternity-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '(.isDraft or .isPrerelease) | not'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Record the verified source revision
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the author SDK dependency graph
        run: pnpm --filter @arcadia-eternity/content-sdk... --filter @arcadia-eternity/data-pack-base... --filter @arcadia-eternity/protocol... run build
      - name: Test author tooling and package loader
        run: |
          pnpm test:content-dev
          pnpm --filter @arcadia-eternity/pack-loader test:run
      - name: Pack and inspect the eight release archives
        run: pnpm pack:ugc
      - name: Install the archives and run an author project
        run: pnpm verify:ugc-release
      - uses: actions/upload-artifact@v4
        with:
          name: ugc-npm-packages
          path: dist/ugc-release/
          if-no-files-found: error

  publish-packages:
    needs: verify-archives
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: publish-ugc-packages
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-archives.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ugc-npm-packages
          path: dist/ugc-release/
      - name: Publish verified archives with npm Trusted Publishing
        run: node scripts/release-author-sdk.mjs publish
      - name: Install the published release and repeat the author workflow
        run: node scripts/release-author-sdk.mjs verify --registry
