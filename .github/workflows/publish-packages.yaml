name: Publish UGC Packages

on:
  repository_dispatch:
    types: [base-pack-release]
  push:
    tags: ['data-pack-base-v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SDK or data-pack-base release tag'
        required: true
        type: string
      verified_run_id:
        description: 'Retry with the verified archives from this Actions run'
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.client_payload.tag_name || github.ref_name }}
  BASE_ONLY: ${{ github.event_name == 'repository_dispatch' || startsWith(inputs.tag || github.ref_name, 'data-pack-base-v') }}

jobs:
  release-source:
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check the requested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE_ONLY" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^data-pack-base-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            exit
          fi
          [[ "$RELEASE_TAG" =~ ^arcadia-eternity-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '(.isDraft or .isPrerelease) | not'
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Record the verified source revision
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-archives:
    needs: release-source
    if: inputs.verified_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the author SDK dependency graph
        run: pnpm --filter @arcadia-eternity/content-sdk... --filter @arcadia-eternity/data-pack-base... --filter @arcadia-eternity/protocol... run build
      - name: Test author tooling and package loader
        run: |
          pnpm test:content-dev
          pnpm --filter @arcadia-eternity/pack-loader test:run
      - name: Pack and inspect the selected archives
        run: node scripts/release-author-sdk.mjs "${{ env.BASE_ONLY == 'true' && 'pack-base' || 'pack' }}"
      - name: Record archive source
        run: git rev-parse HEAD > dist/ugc-release/source-commit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ugc-npm-packages-${{ env.RELEASE_TAG }}
          path: dist/ugc-release/
          if-no-files-found: error

  publish-packages:
    needs: [release-source, verify-archives]
    if: >-
      !cancelled() && needs.release-source.result == 'success' &&
      (needs.verify-archives.result == 'success' ||
       (needs.verify-archives.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.verified_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-ugc-packages-${{ github.event_name == 'repository_dispatch' || startsWith(inputs.tag || github.ref_name, 'data-pack-base-v') }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.21.0
      - run: pnpm --filter @arcadia-eternity/const install --prod --frozen-lockfile --ignore-scripts
      - name: Verify the original publishing workflow
        if: inputs.verified_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.verified_run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -er --arg repo "$GITHUB_REPOSITORY" --arg tag "$RELEASE_TAG" '
              select(.head_repository.full_name == $repo) |
              select(
                (.path == ".github/workflows/publish-packages.yaml" or .path == ".github/workflows/release-please.yml") and
                ((.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch" or .event == "repository_dispatch")) or
                 (.path == ".github/workflows/publish-packages.yaml" and .event == "push" and .head_branch == $tag))
              ) | .head_sha' > "$RUNNER_TEMP/archive-run-head"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ugc-npm-packages-${{ env.RELEASE_TAG }}
          path: dist/ugc-release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || github.run_id }}
      - name: Match the verified archives to the release tag
        if: inputs.verified_run_id != ''
        env:
          TAG_COMMIT: ${{ needs.release-source.outputs.commit }}
        run: |
          source=dist/ugc-release/source-commit
          # Older archives predate the source record and must come from a run on the tag commit.
          [[ -f "$source" ]] || source="$RUNNER_TEMP/archive-run-head"
          [[ "$(cat "$source")" == "$TAG_COMMIT" ]]
      - name: Publish verified archives with npm Trusted Publishing
        run: node scripts/release-author-sdk.mjs "${{ env.BASE_ONLY == 'true' && 'publish-base' || 'publish' }}"
