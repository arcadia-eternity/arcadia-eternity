name: Battle regression baseline

on:
  pull_request:
    branches: [refactor/v4, main]
  push:
    branches: [refactor/v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      headless: ${{ steps.scope.outputs.headless }}
      server: ${{ steps.scope.outputs.server }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check battle CI path selection
        run: node --test scripts/battle-ci-scope.test.mjs
      - name: Select affected battle checks
        id: scope
        run: node scripts/battle-ci-scope.mjs

  # Keep these checks present on every PR; workflow-level paths can leave required checks pending.
  # If scope detection fails, run all jobs so a filtering error cannot remove test coverage.
  headless-battle:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.headless == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build battle dependency graph
        run: pnpm --filter @arcadia-eternity/battle... --filter @arcadia-eternity/data-pack-base... --filter @arcadia-eternity/pack-loader... run build
      - name: Lint
        run: |
          pnpm lint
          pnpm lint:battle-baseline
      - name: Typecheck baseline tests and imported battle source
        run: pnpm typecheck:battle-baseline
      - name: Run all V2 battle regressions (no services)
        run: pnpm test:battle-baseline
      - name: Verify complete V1 source provenance and import boundary
        run: pnpm verify:battle-v4-source
      - name: Typecheck and lint original V1 port tests and adapters
        run: |
          pnpm typecheck:battle-v4
          pnpm lint:battle-v4
      - name: Run real original V1 battles and mechanism regressions
        run: pnpm test:battle-v4
      - name: Build and execute original V1 in Node and Chrome
        run: pnpm verify:battle-v4-hosts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v1-host-evidence
          path: packages/battle/dist/v1-host-check/
          if-no-files-found: ignore

  native-server-entry:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build server, console and native runtime dependencies
        run: pnpm --filter @arcadia-eternity/server... --filter @arcadia-eternity/console... --filter @arcadia-eternity/cli-validator... --filter @arcadia-eternity/p2p-transport... run build
      - name: Check native server source and test types
        run: |
          pnpm typecheck:server-native
          pnpm lint:server-native
      - name: Verify native construction and existing V2 recovery
        run: pnpm test:server-native
      - name: Verify native content and bootstrap in Node and Chrome
        run: pnpm verify:battle-v4-native-pack
      - name: Check CLI types and native local execution
        run: |
          pnpm typecheck
          pnpm exec eslint bin/cli.ts bin/native-local-battle.ts
          pnpm test:cli-native

  native-browser-entry:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build browser dependencies
        run: pnpm --filter '@arcadia-eternity/web-ui^...' run build
      - name: Check native browser construction and transport types
        run: |
          pnpm typecheck:web-native
          pnpm lint:web-native
      - name: Verify shared native factory and actual P2P messages
        run: pnpm test:web-native
      - name: Install browser
        run: pnpm --filter @arcadia-eternity/web-ui exec playwright install --with-deps chromium
      - name: Verify native local page, selected teams and cold startup
        run: pnpm test:web-native:e2e
