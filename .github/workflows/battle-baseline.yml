name: Battle regression baseline

on:
  pull_request:
    branches: [refactor/v4, main]
  push:
    branches: [refactor/v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      headless: ${{ steps.scope.outputs.headless }}
      server: ${{ steps.scope.outputs.server }}
      browser: ${{ steps.scope.outputs.browser }}
      cli: ${{ steps.scope.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check battle CI path selection
        run: node --test scripts/battle-ci-scope.test.mjs
      - name: Select affected battle checks
        id: scope
        run: node scripts/battle-ci-scope.mjs

  # Keep these checks present on every PR; workflow-level paths can leave required checks pending.
  # If scope detection fails, run all jobs so a filtering error cannot remove test coverage.
  headless-battle:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.headless == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build battle dependency graph
        run: pnpm --filter @arcadia-eternity/battle... --filter @arcadia-eternity/data-pack-base... --filter @arcadia-eternity/pack-loader... run build
      - name: Lint
        run: pnpm lint
      - name: Verify complete V1 source provenance and import boundary
        run: pnpm verify:battle-v4-source
      - name: Verify trusted capability build identities
        run: node --test scripts/build-environment.test.mjs
      - name: Typecheck and lint original V1 port tests and adapters
        run: |
          pnpm typecheck:battle-v4
          pnpm lint:battle-v4
      - name: Run real original V1 battles and mechanism regressions
        run: pnpm test:battle-v4
      - name: Build and execute original V1 in Node and Chrome
        run: pnpm verify:battle-v4-hosts
      - name: Verify waiting checkpoints in Node and Chrome
        run: pnpm verify:battle-v4-waiting-snapshots
      - name: Verify independent behavior uses in Node and Chrome
        run: pnpm verify:battle-v4-behaviors
      - name: Verify native templates across hosts
        run: pnpm verify:battle-v4-templates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v1-host-evidence
          path: packages/battle/dist/v1-host-check/
          if-no-files-found: ignore

  native-server-entry:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgres://arcadia_test:arcadia_test@localhost:5432/arcadia_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arcadia_test
          POSTGRES_PASSWORD: arcadia_test
          POSTGRES_DB: arcadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcadia_test -d arcadia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build server, console and native runtime dependencies
        run: pnpm --filter @arcadia-eternity/server... --filter @arcadia-eternity/console... --filter @arcadia-eternity/cli-validator... --filter @arcadia-eternity/p2p-transport... run build
      - name: Verify native metadata and converted JSON locale loading
        run: pnpm --filter @arcadia-eternity/pack-loader exec vitest run test/native-loader.test.ts --maxWorkers=1
      - name: Check native server source and test types
        run: |
          pnpm typecheck:server-native
          pnpm lint:server-native
      - name: Verify native construction, recovery and disconnect handling
        run: pnpm test:server-native
      - name: Verify native content and bootstrap in Node and Chrome
        run: pnpm verify:battle-v4-native-pack
      - name: Check CLI types and native local execution
        run: |
          pnpm typecheck
          pnpm exec eslint bin/cli.ts bin/native-local-battle.ts
          pnpm test:cli-native

  native-browser-entry:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build browser dependencies
        run: pnpm --filter '@arcadia-eternity/web-ui^...' run build
      - name: Build browser application and generate auto-import lint globals
        run: pnpm --filter @arcadia-eternity/web-ui run build-only
      - name: Check native browser construction and transport types
        run: |
          pnpm typecheck:web-native
          pnpm lint:web-native
      - name: Verify shared native factory and actual P2P messages
        run: pnpm test:web-native
      - name: Verify server account client and recovery flows
        run: pnpm --filter @arcadia-eternity/web-ui exec vitest run src/services/__tests__/serverSession.test.ts --maxWorkers=1
      - name: Verify server content environments in the browser client
        run: pnpm --filter @arcadia-eternity/web-ui exec vitest run src/services/__tests__/serverEnvironment.test.ts src/stores/__tests__/privateRoomEnvironment.test.ts src/stores/__tests__/authServerSwitch.test.ts src/stores/__tests__/battleClientSwitch.test.ts src/stores/__tests__/gameData.native.test.ts src/pages/__tests__/lobbyEnvironment.test.ts --maxWorkers=1
      - name: Verify local development workspace editing
        run: pnpm --filter @arcadia-eternity/web-ui exec vitest run src/services/__tests__/developmentWorkspace.test.ts src/features/development/__tests__/DevelopmentWorkspacePage.test.ts --maxWorkers=1
      - name: Verify desktop local host lifecycle
        run: node --test packages/web-ui/electron/test/local-battle-host.test.mjs scripts/desktop-runtime-licenses.test.mjs scripts/stage-desktop-runtime.test.mjs
      - name: Install browser
        run: pnpm --filter @arcadia-eternity/web-ui exec playwright install --with-deps chromium
      - name: Verify native local page, selected teams and cold startup
        run: pnpm test:web-native:e2e
      - name: Verify ordinary matchmaking and authoritative friend rooms
        run: PLAYWRIGHT_ONLINE=1 pnpm --filter @arcadia-eternity/web-ui exec playwright test e2e/matchmaking-online.spec.ts e2e/server-room-online.spec.ts
      - uses: actions/cache@v4
        with:
          path: packages/web-ui/.static-assets-cache
          key: static-assets-${{ hashFiles('resource/static-assets.lock.json') }}
      - name: Verify offline startup and locked official assets
        run: |
          node --test scripts/prepare-static-assets.test.mjs
          node --test packages/web-ui/scripts/build-offline.test.mjs
          pnpm --filter @arcadia-eternity/web-ui exec vitest run src/stores/__tests__/playerIdentity.test.ts src/stores/__tests__/offlineStorage.test.ts src/app/__tests__/bootstrap.test.ts src/app/__tests__/onlineSession.test.ts src/bootstrap/__tests__/ruffle.test.ts src/utils/__tests__/officialAssetUrl.test.ts --maxWorkers=1
      - name: Build self-contained static application
        run: pnpm --filter @arcadia-eternity/web-ui run build:static-only
      - name: Verify production battles, offline reload and storage failures
        run: pnpm --filter @arcadia-eternity/web-ui run test:e2e:static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-web-evidence
          path: packages/web-ui/test-results/
          if-no-files-found: ignore

  offline-cli:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cli == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build offline dependency graph
        run: pnpm --filter '@arcadia-eternity/cli^...' --filter @arcadia-eternity/content-dev... run build
      - name: Check CLI types
        run: pnpm typecheck:cli
      - name: Run relocated offline CLI and lifecycle regressions
        run: pnpm test:cli
      - name: Verify standard npm artifacts, admission and content environments
        run: pnpm --filter @arcadia-eternity/pack-loader test:run
      - name: Verify generated UGC authoring project
        run: node --test examples/ugc/test/create-content-pack.test.mjs
      - name: Verify shared content-pack development tooling
        run: |
          pnpm test:content-dev
          node --test scripts/stage-author-sdk.test.mjs
