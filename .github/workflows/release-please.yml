name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # 当创建release时，自动合并到production分支
  merge-to-production:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or update production branch
        run: |
          # 检查production分支是否存在
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            echo "Production branch exists, checking out..."
            git checkout production
            git pull origin production
          else
            echo "Creating production branch..."
            git checkout -b production
          fi

      - name: Merge the release tag to production
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git merge "refs/tags/$RELEASE_TAG" --no-ff -m "chore: merge $RELEASE_TAG to production"
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD

      - name: Push production branch
        run: |
          git push origin production

      - name: Trigger production workflows via repository dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'production-release',
              client_payload: {
                version: '${{ needs.release-please.outputs.version }}',
                tag_name: '${{ needs.release-please.outputs.tag_name }}'
              }
            });
            console.log('Triggered production workflows via repository dispatch');

      - name: Record the release dispatch
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "Dispatched production build and desktop release for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
