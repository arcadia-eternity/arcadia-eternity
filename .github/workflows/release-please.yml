name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'Retry npm publishing for an existing release tag'
        type: string
      verified_run_id:
        description: 'Actions run containing the original verified archives'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate-inputs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate npm retry inputs
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          VERIFIED_RUN: ${{ inputs.verified_run_id }}
        run: |
          [[ -z "$NPM_TAG" || "$NPM_TAG" =~ ^(data-pack-base|arcadia-eternity)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ -z "$VERIFIED_RUN" || ( -n "$NPM_TAG" && "$VERIFIED_RUN" =~ ^[0-9]+$ ) ]] || exit 1

  release:
    needs: validate-inputs
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ inputs.npm_tag || github.ref }}
      cancel-in-progress: false
    outputs:
      sdk_tag: ${{ startsWith(inputs.npm_tag, 'arcadia-eternity-v') && inputs.npm_tag || steps.tags.outputs.client }}
      base_tag: ${{ startsWith(inputs.npm_tag, 'data-pack-base-v') && inputs.npm_tag || steps.tags.outputs.content }}
      client_release: ${{ steps.tags.outputs.client }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Run release-please
        if: inputs.npm_tag == ''
        uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v7.0.1
        if: steps.release.outputs.releases_created == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve both tags of a joint release, including a partially retried release
        if: steps.release.outputs.releases_created == 'true'
        id: tags
        env:
          CLIENT_TAG: ${{ steps.release.outputs.tag_name }}
          CONTENT_TAG: ${{ steps.release.outputs['packs--tag_name'] }}
        run: node scripts/resolve-release-tags.mjs

  publish-content:
    needs: [release, publish-sdk]
    if: >-
      !cancelled() && needs.release.outputs.base_tag != '' &&
      (needs.release.outputs.sdk_tag == '' || needs.publish-sdk.result == 'success')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yaml
    with:
      tag: ${{ needs.release.outputs.base_tag }}
      verified_run_id: ${{ inputs.verified_run_id }}

  publish-sdk:
    needs: release
    if: needs.release.outputs.sdk_tag != ''
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yaml
    with:
      tag: ${{ needs.release.outputs.sdk_tag }}
      verified_run_id: ${{ inputs.verified_run_id }}

  # 当创建release时，自动合并到production分支
  merge-to-production:
    needs: [release, publish-content]
    if: >-
      !cancelled() && needs.release.outputs.client_release != '' &&
      (needs.release.outputs.base_tag == '' || needs.publish-content.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or update production branch
        run: |
          # 检查production分支是否存在
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            echo "Production branch exists, checking out..."
            git checkout production
            git pull origin production
          else
            echo "Creating production branch..."
            git checkout -b production
          fi

      - name: Merge the release tag to production
        env:
          RELEASE_TAG: ${{ needs.release.outputs.client_release }}
        run: |
          git merge "refs/tags/$RELEASE_TAG" --no-ff -m "chore: merge $RELEASE_TAG to production"
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD

      - name: Push production branch
        run: |
          git push origin production

      - name: Trigger production workflows via repository dispatch
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'production-release',
              client_payload: {
                version: '${{ needs.release.outputs.version }}',
                tag_name: '${{ needs.release.outputs.client_release }}'
              }
            });
            console.log('Triggered production workflows via repository dispatch');

      - name: Record the release dispatch
        env:
          RELEASE_TAG: ${{ needs.release.outputs.client_release }}
        run: echo "Dispatched production build and desktop release for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
