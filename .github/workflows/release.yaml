name: Release Desktop App

on:
  repository_dispatch:
    types: [production-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.input.outputs.version }}
      artifact_version: ${{ steps.input.outputs.artifact_version }}
      tag: ${{ steps.input.outputs.tag }}
      commit: ${{ steps.input.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve release version and exact source
        id: input
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { execFileSync, spawnSync } from 'node:child_process'
          import { releaseVersion } from './scripts/merge-desktop-release-manifests.mjs'
          const version = releaseVersion(process.env.REQUESTED_VERSION)
          const tag = `v${version}`
          const remote = spawnSync('git', ['ls-remote', '--exit-code', 'origin', `refs/tags/${tag}`], { encoding: 'utf8' })
          let commit
          if (remote.status === 0) {
            execFileSync('git', ['fetch', '--no-tags', '--depth=1', 'origin', `refs/tags/${tag}`], { stdio: 'inherit' })
            commit = execFileSync('git', ['rev-parse', 'FETCH_HEAD^{commit}'], { encoding: 'utf8' }).trim()
          } else if (remote.status === 2 && process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            // A new manual version is built from this workflow's exact revision and creates only a draft.
            commit = process.env.GITHUB_SHA
          } else {
            throw new Error(`Cannot resolve requested release tag ${tag}: ${remote.stderr || 'tag is missing'}`)
          }
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('Release source is not an exact commit')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nartifact_version=${version.replaceAll('+', '-')}\ntag=${tag}\ncommit=${commit}\n`)
          console.log(JSON.stringify({ version, tag, commit }))
          NODE

  build-desktop:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            os: mac
            config: mac
            args: '--mac zip --arm64'
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            os: mac
            config: mac
            args: '--mac zip --x64'
          - runner: windows-2025
            platform: win32
            arch: x64
            os: win
            config: win
            args: '--win nsis zip --x64'
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            os: linux
            config: linux
            args: '--linux AppImage --x64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      HUSKY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Workspace clean scripts use rm; hosted Windows runners include Git Bash.
      npm_config_script_shell: bash
      NODE_OPTIONS: --max-old-space-size=4096
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Verify native runner target
        run: |
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.platform, process.env.EXPECTED_PLATFORM); assert.equal(process.arch, process.env.EXPECTED_ARCH); console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version }));'
      - name: Install Electron runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libxss1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply application version to renderer build input
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs'
          const file = 'packages/web-ui/package.json'
          const manifest = JSON.parse(readFileSync(file, 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `source_version=${manifest.version}\n`)
          // Vite's JSON import, web manifest, and npm_package_version share this input.
          manifest.version = process.env.RELEASE_VERSION
          writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n')
          NODE
      - name: Build workspace runtime dependencies
        run: pnpm run build:package
      - name: Build desktop renderer
        env:
          GITHUB_SHA: ${{ needs.prepare.outputs.commit }}
          COMMIT_HASH: ${{ needs.prepare.outputs.commit }}
        run: pnpm --filter @arcadia-eternity/web-ui run build-only
      - name: Stage runtime and native addon for this target
        run: pnpm exec node scripts/stage-desktop-runtime.mjs --output packages/web-ui/dist/arcadia-server --online
      - name: Require complete runtime notices before packaging
        run: node scripts/verify-desktop-pack.mjs --require-complete-notices
      - name: Build distributable and verify packaged native host
        env:
          ARCADIA_DESKTOP_MANAGED_HOST_TEST: '1'
          # ASCII names match GitHub updater URLs; OS prevents Mac/Windows x64 ZIP collisions.
          ARTIFACT_NAME: Arcadia-Eternity-${{ needs.prepare.outputs.artifact_version }}-${{ matrix.os }}-${{ matrix.arch }}.${ext}
        run: pnpm --filter @arcadia-eternity/web-ui exec electron-builder ${{ matrix.args }} --publish never --config.extraMetadata.version="$RELEASE_VERSION" --config.${{ matrix.config }}.artifactName="$ARTIFACT_NAME"
      - name: Record validated build inputs
        env:
          SOURCE_PACKAGE_VERSION: ${{ steps.metadata.outputs.source_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          writeFileSync('packages/web-ui/release/desktop-build.json', JSON.stringify({
            format: 'arcadia.desktop-release-build/1',
            version: process.env.RELEASE_VERSION,
            commit: process.env.SOURCE_COMMIT,
            tag: process.env.RELEASE_TAG,
            platform: process.platform,
            arch: process.arch,
            versionInput: { source: process.env.SOURCE_PACKAGE_VERSION, effective: process.env.RELEASE_VERSION, path: 'packages/web-ui/package.json', builderExtraMetadata: true },
          }, null, 2) + '\n', { flag: 'wx' })
          NODE
      - name: Preserve validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            packages/web-ui/release/Arcadia-Eternity-*
            packages/web-ui/release/*.yml
            !packages/web-ui/release/builder-debug.yml
            packages/web-ui/release/desktop-build.json

  publish-desktop:
    needs: [prepare, build-desktop]
    runs-on: ubuntu-24.04
    concurrency:
      group: desktop-release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      HUSKY: '0'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install manifest tooling without build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve exact native artifact IDs
        id: artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            })
            const targets = [['darwin', 'arm64'], ['darwin', 'x64'], ['win32', 'x64'], ['linux', 'x64']]
            const sources = targets.map(([platform, arch]) => {
              const pattern = new RegExp(`^desktop-release-${context.runId}-([0-9]+)-${platform}-${arch}$`)
              // A rerun of failed jobs carries over successful targets. Keep their real attempt and ID.
              const found = artifacts.flatMap(artifact => {
                const match = pattern.exec(artifact.name)
                return match && !artifact.expired && Number(match[1]) <= Number(process.env.GITHUB_RUN_ATTEMPT)
                  ? [{ artifact, attempt: Number(match[1]) }] : []
              }).sort((a, b) => b.attempt - a.attempt)
              if (!found.length || found[1]?.attempt === found[0].attempt) throw new Error(`Expected one native artifact for ${platform}/${arch}`)
              const artifact = found[0].artifact
              return { artifactId: artifact.id, artifactName: artifact.name, digest: artifact.digest, platform, arch }
            })
            fs.writeFileSync('artifact-sources.json', JSON.stringify(sources, null, 2) + '\n', { flag: 'wx' })
            core.setOutput('ids', sources.map(source => source.artifactId).join(','))
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: release-inputs
          merge-multiple: false
      - name: Verify assets and merge native update manifests
        run: node scripts/merge-desktop-release-manifests.mjs release-inputs release-assets "$RELEASE_VERSION" "$SOURCE_COMMIT" artifact-sources.json
      - name: Locate release without changing its notes or publication state
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            let tagMissing = false
            try {
              let object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object
              for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
                object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object
              }
              if (object.type !== 'commit' || object.sha !== process.env.SOURCE_COMMIT)
                throw new Error(`Release tag ${tag} no longer matches the validated source`)
            } catch (error) {
              if (error.status !== 404 || process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') throw error
              tagMissing = true
            }
            let release
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data
            } catch (error) {
              if (error.status !== 404) throw error
              const drafts = (await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 }))
                .filter(item => item.tag_name === tag && item.draft)
              if (drafts.length > 1) throw new Error(`More than one draft release exists for ${tag}`)
              release = drafts[0] ?? (await github.rest.repos.createRelease({
                  ...context.repo,
                  tag_name: tag,
                  target_commitish: process.env.SOURCE_COMMIT,
                  name: process.env.RELEASE_VERSION,
                  draft: true,
                  prerelease: process.env.RELEASE_VERSION.split('+')[0].includes('-'),
                })).data
            }
            if (tagMissing) {
              if (!release.draft) throw new Error('A published release must have the validated source tag')
              const target = (await github.rest.repos.getCommit({ ...context.repo, ref: release.target_commitish })).data.sha
              if (target !== process.env.SOURCE_COMMIT) throw new Error('Draft release targets a different source commit')
            }
            core.setOutput('id', release.id)
            core.info(`Uploading assets to release ${release.id} (${release.tag_name}); draft=${release.draft}`)
      - name: Check existing assets before any upload
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const { createHash } = require('node:crypto')
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: Number(process.env.RELEASE_ID), per_page: 100,
            })
            const pending = []
            const names = fs.readdirSync('release-assets').sort((a, b) => Number(!a.startsWith('Arcadia-Eternity-')) - Number(!b.startsWith('Arcadia-Eternity-')) || a.localeCompare(b))
            for (const name of names) {
              const file = path.join('release-assets', name)
              const matches = existing.filter(asset => asset.name === name)
              if (matches.length > 1) throw new Error(`Duplicate existing release asset: ${name}`)
              if (!matches.length) { pending.push(name); continue }
              const hash = createHash('sha256')
              for await (const chunk of fs.createReadStream(file)) hash.update(chunk)
              const digest = `sha256:${hash.digest('hex')}`
              if (matches[0].size !== fs.statSync(file).size || matches[0].digest !== digest)
                throw new Error(`Existing asset differs or has no verifiable digest: ${name}; refusing to overwrite it`)
              core.info(`Keeping identical existing asset: ${name}`)
            }
            fs.writeFileSync('release-upload-plan.json', JSON.stringify(pending) + '\n', { flag: 'wx' })
      - name: Upload missing binaries before update manifests
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { join } from 'node:path'
          const repository = process.env.GITHUB_REPOSITORY
          const tag = process.env.RELEASE_TAG
          const selected = execFileSync('gh', ['release', 'view', tag, '--repo', repository, '--json', 'databaseId', '--jq', '.databaseId'], { encoding: 'utf8' }).trim()
          if (selected !== process.env.RELEASE_ID) throw new Error('GitHub CLI selected a different release')
          for (const name of JSON.parse(readFileSync('release-upload-plan.json', 'utf8'))) {
            execFileSync('gh', ['release', 'upload', tag, join('release-assets', name), '--repo', repository], { stdio: 'inherit' })
          }
          NODE

  notify:
    needs: publish-desktop
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify completion
        env:
          RELEASE_RESULT: ${{ needs.publish-desktop.result }}
        run: |
          if [ "$RELEASE_RESULT" = success ]; then
            echo 'Desktop release artifacts uploaded successfully'
          else
            echo "Desktop release did not complete: $RELEASE_RESULT"
          fi
