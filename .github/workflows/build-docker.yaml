name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - production
  push:
    branches: [main, master]
    paths:
      - 'packages/**'
      - 'packs/**'
      - 'data/**'
      - 'bin/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-docker.yaml'
      - 'pnpm-workspace.yaml'
      - '.pnpmfile.cjs'
      - '.npmrc'
      - 'scripts/**'
      - 'resource/**'
      - 'types/**'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'rolldown.config.*'
      - 'docs/guides/ugc-authoring-agent/**'
      - 'docs/guides/seer2-recreate-pet/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="development"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Building for environment: $ENV"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_ENV=${{ steps.env.outputs.environment == 'production' && 'production' || 'development' }}
            BUILD_ENV=${{ steps.env.outputs.environment }}
